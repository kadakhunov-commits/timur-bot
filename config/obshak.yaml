# Общак — трекер расходов общего котла для четверых соседей.
# Всё пользовательское (состав, категории, пороги, фразы) живёт здесь.

currency: "₽"
currency_short: "руб"

# Беседа, в которой живёт общак. Используется для проверки членства при
# привязке аватара и (опционально) для закрепа карточки. 0 — не проверять.
chat_id: 0

# Закреплять карточку с кнопкой при первом вызове /obshak в беседе.
# В группах меню-кнопки у ботов не бывает, поэтому pinned-карточка —
# единственный постоянный вход в миниапп. Нужны права «Закреплять сообщения».
pin_group_card: true

# Часовой пояс для периодов «неделя/месяц» и день/ночь на кухне.
timezone: "Europe/Moscow"

# Восемь недель календаря активности.
calendar_weeks: 8

members:
  - key: rustem
    name: "Рустем"
    color: "#3ddc97"
    avatar: rustem
  - key: kadyr
    name: "Кадыр"
    color: "#ffb347"
    avatar: kadyr
  - key: dilyara
    name: "Диляра"
    color: "#ff6b9d"
    avatar: dilyara
  - key: amir
    name: "Амир"
    color: "#6bb8ff"
    avatar: amir

categories:
  - key: food
    name: "Еда"
    icon: jar
  - key: household
    name: "Быт"
    icon: soap
  - key: drinks
    name: "Напитки"
    icon: bottle
  - key: fun
    name: "Веселье"
    icon: spark
  - key: other
    name: "Прочее"
    icon: box

# Чипсы быстрого ввода.
quick_titles:
  - майонез
  - хлеб
  - молоко
  - вода
  - бумага
  - сахар
  - чай
  - яйца
  - сыр
  - пельмени

receipt_jokes:
  - "майонез одобрен администрацией"
  - "общага благодарит за вклад"
  - "чек действителен до первого голода"
  - "скидка на совесть не предусмотрена"
  - "товар принят, кот доволен"
  - "внесено в летопись соседей"
  - "возврату не подлежит: уже съедено"
  - "бухгалтерия соседей одобряет"

# Уровни банки-общака. threshold — накопленный итог за всё время.
jar_levels:
  - name: "Пустая банка"
    threshold: 0
  - name: "На доширак"
    threshold: 1000
  - name: "На пельмени"
    threshold: 3000
  - name: "На шашлык"
    threshold: 7000
  - name: "На новогодний стол"
    threshold: 15000
  - name: "Магнат соседей"
    threshold: 30000

# Погода за окном. Данные тянет сервер (wttr.in, без ключа) и кэширует.
weather:
  enabled: true
  city: "Moscow"
  cache_minutes: 30

# Кот комментирует выключатель.
light_phrases:
  - "мяу. я тут вообще-то читал"
  - "светло — значит можно жрать"
  - "выключил. ну и сиди в темноте"
  - "я тебя всё равно вижу"

pet:
  name: "Барсик"
  # Уровни кота. threshold — общее число покупок за всё время.
  levels:
    - name: "Котёнок"
      threshold: 0
    - name: "Молодой кот"
      threshold: 10
    - name: "Упитанный кот"
      threshold: 40
    - name: "Кот-барон"
      threshold: 120
    - name: "Легенда соседей"
      threshold: 300
  phrases:
    happy:
      - "мур. хорошие сегодня соседи"
      - "я всё вижу. и одобряю"
      - "ещё пару пакетов — и я на диету"
      - "кормите кухню, кормите меня"
    proud:
      - "уважаю. это был серьёзный вклад"
      - "вот это я понимаю, закупка"
      - "за такое я даже мурлыкну"
    bored:
      - "что-то вы затихли. майонез кончается"
      - "я тут один, среди пустых полок"
      - "может, хоть хлеба купите?"
    hungry:
      - "в холодильнике мышь повесилась. и та ушла"
      - "я не наглый, я голодный"
      - "дней без покупок: слишком много"

achievements:
  big_one: 1000            # «Кит»: разовая покупка не меньше
  collector_categories: 5  # «Коллекционер»: разных категорий
  repeat_title_count: 5    # «Магнат»: одинаковое название столько раз
  patron_month_count: 10   # «Меценат»: покупок за календарный месяц
  stability_weeks: 4       # «Стабильность»: недель подряд с покупками
  veteran_days: 100        # «Долгожитель»: дней с первой покупки
  night_from: 0            # «Ночной дозор»
  night_to: 5
  night_recent_hours: 6    # ночной подкол уместен только N часов после покупки
  early_from: 6            # «Ранняя пташка»
  early_to: 8

# Кнопки-хвастуны в карточке запроса денег (кнопка «пнуть»).
poke_phrases:
  - "ну ты чё, мы же свои"
  - "соседи всё помнят"
  - "кот смотрит на тебя с укором"
  - "скинь, не позорься"
  - "в летописи останется твоё имя"

# Квест недели: каждый понедельник берётся следующий по кругу.
weekly_quests:
  - key: days
    title: "Закупиться в три разных дня"
    target: 3
  - key: household
    title: "Закрыть быт: что-то из «Быта»"
    target: 1
  - key: everyone
    title: "Отметиться всем четверым"
    target: 4
  - key: amount
    title: "Собрать 3 000 ₽ за неделю"
    target: 3000

# Кот-подъёбус: подколы при входе. Ключ выбирается по ситуации человека,
# шаблон — по дню, чтобы фраза менялась, но не прыгала каждую секунду.
roasts:
  zero:
    - "{name}, ноль покупок. ты вообще тут живёшь?"
    - "{name} зашёл посмотреть, как другие тратят. красиво, да?"
    - "первый вклад — самый страшный, {name}. я верю в тебя"
  absent:
    - "{name}, {days} дней без вклада. соседи начали забывать твоё имя"
    - "где тебя носило {days} дней, {name}? майонез сам себя не купит"
    - "{days} дней тишины. я уже думал, ты снимаешь другую квартиру"
  last_place:
    - "{name}, ты последний в рейтинге. даже я вложил больше"
    - "{top_name} вложил {top_total}, а ты {mine}. как так, {name}?"
    - "место {place} из {total_members}. не хочешь обсудить, {name}?"
  same_item:
    - "{item} ×{count}. {name}, ты в порядке?"
    - "опять {item}? смелый выбор, {name}"
    - "{name} и {item} — история, которая никогда не закончится"
  big_spender:
    - "{name}, ты снова всех содержишь. научись говорить «нет»"
    - "{total} в кассе, и большая часть — твоя, {name}. спасибо, что ли"
    - "спонсор квартиры, {name}. хоть бы кружку подарили"
  night:
    - "{name} в {time} по магазинам. ночной дозор, как всегда"
    - "в {time}? {name}, спи"
    - "ночная закупка от {name}. я не сплю, я всё видел"
  default:
    - "{name}, соседи ждут твоих подвигов"
    - "зашёл — значит есть совесть, {name}"
    - "{name}, в банке {total}. есть куда расти"
    - "привет, {name}. кот голоден, касса пуста, намекаю"

news:
  sponsor_week:
    - "СПОНСОР НЕДЕЛИ: {name} — {amount} {currency}"
    - "{name} СНОВА ЗАКУПИЛСЯ НА {amount} {currency}"
  frequent_item:
    - "ХИТ СОСЕДЕЙ: {item} — уже {count} раз"
    - "МАЙОНЕЗ НЕ ПОБЕДИТЬ: {item} ×{count}"
  big_purchase:
    - "РЕКОРД: {name} выложил {amount} {currency} за раз"
    - "ТРАНЖИРА МЕСЯЦА: {name}, {amount} {currency}"
  night_owl:
    - "НОЧНОЙ ДОЗОР: {name} закупается в {time}"
    - "В {time} КАССУ ПОПОЛНИЛ {name}"
  idle:
    - "ТИШИНА НА КУХНЕ: покупок не было {days} дн."
    - "БАНКА ПУСТЕЕТ: {days} дн. без закупок"
  starter:
    - "Касса открыта. Первый вклад — {name}"
