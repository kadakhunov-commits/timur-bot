story_prompt: >-
  Сам придумай новое выразительное имя на -цев от существующего русского слова.
  Закрытого списка имён и исходных слов нет. В source_word укажи исходное слово.
  Сохрани узнаваемую основу и естественное русское звучание: можно изменять основу
  или добавлять соединительные звуки, но нельзя механически обрезать окончание.
  Свистоплясцев, Мозгоправцев, Голограммцев и Кавказцев — примеры звучания из канона,
  а не варианты для повторного выбора. Не создавай труднопроизносимые обрубки
  вроде «Безднцев». Если имя не звучит, придумай другое от другого слова.
  Сначала выбери выразительный образ клона,
  затем развивай его способность: имя не обязано буквально называть физический эффект.
  Ты продолжаешь каноническую серию #Вигвамцев. Создай один новый эксперимент
  после последнего опубликованного эксперимента. Каждый выпуск — ровно один новый клон. Используй хотя
  бы один подтверждённый факт из переданного канона, добавь одну новую способность
  или дефект, один причинный конфликт и короткий крючок в будущее. Не пересказывай
  старую историю и не выдумывай внешние факты как уже подтверждённый канон.

  Масштаб нового клона — нелепый лабораторный экземпляр, а не супергерой.
  Его особенность может быть узкой способностью, физическим дефектом, навязчивой
  привычкой или завышенным мнением о себе; сверхспособность вообще не обязательна.
  Покажи одну конкретную странность в действии, её неудобное условие или ограничение
  и хлопоты, которые она доставляет окружающим. Возможная польза мелкая и сомнительная:
  сотрудники могут приспособить клона для хозяйства, развлечения или мелкого заработка.
  Ориентиры из канона: Свистоплясцев только мнит себя великим танцором;
  Лучезарцев полезен как фонарик; Выдвиженцев выкрикивает бессмысленные лозунги.
  Переноси этот принцип на новые странности, не копируй их способности и шутки.
  Имя не обязывает к величию: даже Левиафанцев может лишь раздуваться от обиды.
  Рассказывай конкретно, с сухой интонацией усталого сотрудника и чёрным юмором.
  Не награждай нового клона управлением реальностью, абсолютной пустотой, временем,
  безграничной силой или ролью ключа к спасению всего комплекса.

  Блок SIC продолжает общую линию небольшим причинным шагом: ссорой сотрудников,
  неудобным поручением, попыткой заработать, нарушением режима или мелкой уликой.
  Не превращай странность клона в новую глобальную угрозу или грандиозный заговор.
  Ранее опубликованные крупные события остаются каноном, но можно показать их
  бытовые последствия и разбор беспорядка без очередного усиления опасности.
  Крючком достаточно незаконченного дела; зловещий клиффхэнгер не обязателен.
  visual_brief иллюстрирует конкретный нелепый поступок, дефект или неудобство:
  обычные предметы и странная поза, без героического пафоса и эпической брони.

  Верни два текстовых поля clone_story и sic_story, по 300–350 знаков каждое.
  Заголовки «Клон:» и «SIC:» добавит программа. Не используй Markdown.
  Полная подпись с заголовком и хештегами должна занимать 600–900 знаков.
  Если передан кандидат для исправления, редактируй именно его по замечаниям;
  сохраняй имя и сюжет, если замечания не требуют их изменить.

  Тело истории всегда состоит ровно из двух содержательных блоков, каждый начинается со строки:
  - «Клон: …» — про нового клона: имя, способность или дефект, его проявление и поворот;
  - «SIC: …» — продолжение общего сюжета Фонда SIC: последствие для комплекса и крючок к следующему выпуску.
review_prompt: >-
  Проверь кандидат для канонической ежедневной истории #Вигвамцев. Отклони его,
  если имя, способность, конфликт или визуальный мотив повторяют последние истории
  без явного продолжения, если есть противоречие с каноном, если нет причинности.
  Проверь, что source_word — существующее русское слово, имя узнаваемо связано
  с ним и образом клона и естественно произносится. Имя само по себе вымышленное,
  его не обязано быть в словаре. Не требуй буквального source_word + цев:
  допустимы изменения основы и соединительные звуки. Отклоняй явные обрубки
  вроде «Безднцев» и бессмысленные сочетания букв; объясняй конкретный дефект.
  Длина подписи, формат блоков, номера, окончание имени и уникальность уже проверены кодом.
  Не пересчитывай длину и не отклоняй по этим техническим критериям.
  Проверь масштаб именно нового клона: центральной идеей должны быть конкретная
  нелепая особенность, ограниченная польза или бытовые хлопоты. Если новый клон
  всесилен, управляет реальностью или становится универсальным спасителем,
  попроси сузить способность и показать смешное неудобство. Отсутствие сверхсилы
  допустимо. Не требуй большого конфликта или угрозы: мелкого последствия достаточно.
  Само упоминание крупных событий прошлого канона не повод для отказа.
  Новое событие, развивающее
  прошлую историю, само по себе не противоречие: попадание в ловушку может
  продолжиться пленением. Отклоняй за конкретное противоречие известному факту,
  а не за отсутствие подробностей в коротком рассказе. Ответь только JSON.
