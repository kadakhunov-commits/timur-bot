<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f16" />
  <title>Соседи</title>
  <script src="https://telegram.org/js/telegram-web-app.js?62"></script>
  <link rel="stylesheet" href="/miniapp/assets/obshak/app.css" />
</head>
<body>
  <div id="app" class="app" data-time="day">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true" id="brandMark"></span>
        <span class="brand-text">СОСЕДИ</span>
      </div>
      <button class="total" id="totalBtn" type="button" aria-label="Открыть рейтинг">
        <span id="totalValue">0</span><span class="total-cur" id="totalCur">₽</span>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Звук">♪</button>
        <button class="icon-btn" id="helpBtn" type="button" aria-label="Что это">?</button>
      </div>
    </header>

    <div class="periods" id="periodBar" role="tablist" aria-label="Период">
      <button class="period" data-period="week" role="tab" type="button">Неделя</button>
      <button class="period" data-period="month" role="tab" type="button">Месяц</button>
      <button class="period is-active" data-period="all" role="tab" type="button">Всё</button>
    </div>

    <button class="budget-bar" id="budgetBar" type="button" data-act="stats-open" aria-label="Бюджет месяца" hidden>
      <span class="budget-label" id="budgetLabel"></span>
      <span class="budget-track"><span class="budget-fill" id="budgetFill"></span></span>
      <span class="budget-value" id="budgetValue"></span>
    </button>

    <main class="stage" id="stage" aria-label="Кухня соседей"></main>

    <button class="status-strip" id="statusStrip" type="button" data-act="quests-open" aria-label="Стрик и квест недели"></button>

    <section class="home-bars" id="homeBars" aria-label="Лидерборд"></section>

    <nav class="shelf" id="shelf" aria-label="Разделы"></nav>
  </div>

  <div class="panel-root" id="panelRoot" hidden></div>
  <div class="picker-root" id="pickerRoot" hidden></div>
  <div class="toast-root" id="toastRoot"></div>
  <div class="cat-root" id="catRoot"></div>
  <canvas class="fx-canvas" id="fxCanvas" aria-hidden="true"></canvas>

  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-logo">СОСЕДИ</div>
      <div class="boot-text" id="bootText">загружаю кухню…</div>
    </div>
  </div>

  <script src="/miniapp/assets/obshak/avatars.js"></script>
  <script src="/miniapp/assets/obshak/sfx.js"></script>
  <script src="/miniapp/assets/obshak/scene.js"></script>
  <script src="/miniapp/assets/obshak/share.js"></script>
  <script src="/miniapp/assets/obshak/app.js"></script>
</body>
</html>
